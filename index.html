<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amthonie</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="images/a.png" />
  <meta name="description" content="Amthonie — personal profile." />

  <!-- Tailwind Play CDN (dev-friendly, no build step) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#FF7A00',
              50:  '#FFF3E8',
              100: '#FFE1C2',
              500: '#FF7A00',
              600: '#E56E00',
              700: '#B85800',
            },
          },
          fontFamily: {
            sans: ['ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>

<body
  class="min-h-screen text-slate-200 antialiased"
  style="background: linear-gradient(in oklch to bottom, black 0% 80%, #FF7A00 100%) fixed;"
>
  <main class="flex min-h-screen flex-col items-center px-6 py-12">

    <!-- Header banner with overlaid avatar -->
    <div class="relative w-4/5 max-w-[1024px] aspect-[4/1] overflow-hidden rounded-2xl shadow-lg ring-1 ring-black/5 dark:ring-white/10">
      <img
        src="images/header_1.jpeg"
        alt="Header"
        class="absolute inset-0 h-full w-full object-cover object-top"
        draggable="false"
      />
      <img
        src="images/avatar.jpeg"
        alt="Amthonie"
        class="absolute bottom-4 left-4 aspect-square h-1/2 rounded-full object-cover bg-brand-500 ring-4 ring-brand-500 shadow-md"
        draggable="false"
      />
    </div>

    <section class="mt-10 w-4/5 max-w-[1024px] rounded-2xl border border-white/15 bg-white/15 px-8 py-10 text-center shadow-xl backdrop-blur-sm">

      <!-- Name + tagline -->
      <h1 class="text-4xl font-bold tracking-tight text-white">
        Amthonie
      </h1>
      <p class="mt-2 text-lg text-brand-500 font-medium">
        Software Engineer &amp; Home Automation Enthusiast
      </p>

      <!-- Links -->
      <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
        <a
          href="https://github.com/Amthonie"
          class="inline-flex items-center gap-2 rounded-full bg-slate-900 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-slate-700 dark:bg-white dark:text-slate-900 dark:hover:bg-slate-200"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5Z" />
          </svg>
          GitHub
        </a>

        <a
          href="https://bsky.app/profile/amthonie.bsky.social"
          class="inline-flex items-center gap-2 rounded-full bg-slate-900 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-slate-700 dark:bg-white dark:text-slate-900 dark:hover:bg-slate-200"
        >
          <svg class="h-4 w-4" viewBox="0 0 568 501" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M123.121 33.664C188.241 82.553 258.281 181.68 284 234.873c25.719-53.192 95.759-152.32 160.879-201.21C491.866-1.611 568-28.906 568 57.947c0 17.346-9.945 145.713-15.778 166.555-20.275 72.453-94.155 90.933-159.875 79.748C507.222 323.8 536.444 388.56 473.333 453.32c-119.86 122.992-172.272-30.859-185.702-70.281-2.462-7.227-3.614-10.608-3.631-7.733-.017-2.875-1.169.506-3.631 7.733-13.43 39.422-65.842 193.273-185.702 70.281-63.111-64.76-33.889-129.52 80.986-149.071-65.72 11.185-139.6-7.295-159.875-79.748C9.945 203.66 0 75.293 0 57.947 0-28.906 76.135-1.611 123.121 33.664Z" />
          </svg>
          Bluesky
        </a>
      </div>

    </section>
  </main>

  <!-- Footer -->
  <footer class="fixed inset-x-0 bottom-0 py-4 text-center text-xs text-slate-300/80">
    &copy; <span id="year"></span> Amthonie
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>

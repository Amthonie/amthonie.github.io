name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel a run in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # need the previous commit to diff against

      - name: Build jottings & chronicle pages from markdown
        run: |
          # Regenerate the generated pages from their markdown sources so the
          # published output always reflects the latest content, even if the
          # committed artifacts are stale. A venv keeps this PEP 668-proof on
          # the hosted runner.
          #   build_jottings.py  -> jottings/index.html, homepage teasers,
          #                         sitemap /jottings/ + home lastmod
          #   build_chronicle.py -> chronicle/index.html, sitemap /chronicle/
          python3 -m venv .venv
          .venv/bin/pip install --quiet markdown
          .venv/bin/python scripts/build_jottings.py
          .venv/bin/python scripts/build_chronicle.py

      - name: Assemble site (static files + built Tailwind CSS)
        run: |
          mkdir -p _site
          # Copy everything except source/build/VCS/tooling into the publish dir.
          # content/ (markdown sources) and scripts/ (the generator) are build
          # inputs, not published assets.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='src' \
            --exclude='content' \
            --exclude='scripts' \
            --exclude='.venv' \
            --exclude='_site' \
            --exclude='node_modules' \
            ./ _site/
          # Standalone Tailwind v4 CLI — self-contained (bundles the tailwindcss
          # package), so no Node/node_modules and no module-resolution issues.
          # The Tailwind output only changes when the HTML it scans or the
          # Tailwind input changes; image-only edits don't affect the CSS. Since
          # styles.css is committed (and copied above), we can safely reuse it
          # and skip the rebuild. Manual runs (no HEAD^) always rebuild.
          # Rebuild when the HTML, the Tailwind input, or the jottings content/
          # generator change (the last two can alter the generated jottings page).
          if ! git rev-parse HEAD^ >/dev/null 2>&1 || \
             git diff --name-only HEAD^ HEAD | grep -qE '\.html$|^src/input\.css$|^content/jottings/|^scripts/build_jottings\.py$|^content/chronicle/|^scripts/build_chronicle\.py$'; then
            echo "HTML/input.css/jottings changed — rebuilding Tailwind CSS"
            # Standalone Tailwind v4 CLI — self-contained (bundles the tailwindcss
            # package), so no Node/node_modules and no module-resolution issues.
            curl -sL -o tailwindcss \
              https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.2/tailwindcss-linux-x64
            chmod +x tailwindcss
            ./tailwindcss -i src/input.css -o _site/styles.css --minify
          else
            echo "No HTML/input.css changes — using committed styles.css"
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Notify IndexNow (Bing/Yandex/etc.) that the site was (re)published, so
      # search engines re-crawl promptly. The key is public by design — it's
      # served at https://amthonie.nl/<key>.txt. Runs after a successful deploy
      # and is non-fatal: an IndexNow outage must not fail the deployment.
      - name: Check out sitemap
        uses: actions/checkout@v7

      - name: Ping IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: 4fa213b807404cff976bb1959a989823
          HOST: amthonie.nl
        run: |
          URL_LIST=$(grep -oP '(?<=<loc>)[^<]+' sitemap.xml | jq -R . | jq -s .)
          if [ "$URL_LIST" = "[]" ]; then
            echo "No <loc> URLs found in sitemap.xml — nothing to submit."
            exit 0
          fi
          BODY=$(jq -n \
            --arg host "$HOST" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://$HOST/$INDEXNOW_KEY.txt" \
            --argjson urlList "$URL_LIST" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')
          echo "Submitting to IndexNow:"
          echo "$BODY"
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$BODY" \
            -w "\nHTTP %{http_code}\n"

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel a run in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (static files + built Tailwind CSS)
        run: |
          mkdir -p _site
          # Copy everything except source/build/VCS/tooling into the publish dir
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='src' \
            --exclude='_site' \
            --exclude='node_modules' \
            ./ _site/
          # Standalone Tailwind v4 CLI — self-contained (bundles the tailwindcss
          # package), so no Node/node_modules and no module-resolution issues.
          curl -sL -o tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.2/tailwindcss-linux-x64
          chmod +x tailwindcss
          ./tailwindcss -i src/input.css -o _site/styles.css --minify

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

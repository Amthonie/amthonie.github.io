<body class="flex flex-col min-h-screen bg-paper text-stone-800 antialiased dark:bg-stone-900 dark:text-stone-100">
<a href="#main" class="skip-link">Skip to content</a>

<!-- Site banner: the branding box lives in a real <header> (banner landmark),
     outside <main> so the skip link and assistive tech can bypass it. -->
<header class="flex w-full flex-col items-center px-2.5 md:px-6 pt-6 md:pt-12">

    <!-- Header: banner image + branded band merged into one box (matches the home page).
         The Amthonie wordmark sits in the band with a back-home button; no subtitle or socials. -->
    <div class="w-full md:w-4/5 max-w-[1280px] overflow-hidden rounded-2xl shadow-xl ring-1 ring-black/5 dark:ring-white/10">
        <a href="/naarden/" aria-label="Back to Naarden" class="group relative block aspect-[4/1] overflow-hidden">
            <img
                    src="../../images/theme/nouveau/header.webp"
                    alt="Decorative abstract header background"
                    aria-hidden="true"
                    class="absolute inset-0 h-full w-full object-cover object-top transition duration-500 group-hover:scale-105"
                    draggable="false"
            />
            <img
                    src="../../images/theme/nouveau/avatar.webp"
                    alt="Profile picture of Amthonie"
                    class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 aspect-square h-[150%] rounded-full object-cover bg-stone-800 ring-2 ring-stone-800 shadow-md"
                    draggable="false"
            />
        </a>
        <div class="flex items-center justify-between gap-6 bg-brand-600 dark:bg-brand-700 px-4 py-4 md:px-8 md:py-6">
            <p class="text-2xl md:text-3xl font-bold tracking-tight text-white">Amthonie</p>
            <a href="/naarden/"
               aria-label="Back to Naarden"
               class="shrink-0 inline-flex items-center gap-1.5 rounded-full border border-white/25 bg-white/15 px-4 py-2 text-sm font-medium text-white transition hover:bg-white/25">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M19 12H5"/>
                    <path d="m12 19-7-7 7-7"/>
                </svg>
                Back to Naarden
            </a>
        </div>
    </div>
</header>

<main id="main" class="flex w-full flex-col items-center px-2.5 md:px-6 pb-12 md:pb-24">

    <!-- Page title box: the H1 followed by the plain-language forecast. The prose is
         pushed to a GitHub gist by Home Assistant and fetched client-side (see the
         <script> near </body>); the paragraph stays hidden until it loads, so a failed
         or empty fetch just leaves the heading — never a dangling empty paragraph. -->
    <section aria-labelledby="wx-title"
             class="mt-3 md:mt-6 w-full md:w-4/5 max-w-[1280px] rounded-2xl border border-black/5 bg-black/5 dark:border-white/10 dark:bg-white/10 px-4 py-4 md:px-8 md:py-6 shadow-xl">
        <h1 id="wx-title" class="text-2xl font-bold tracking-tight text-stone-900 dark:text-white">The weather in Naarden</h1>
        <p id="wx-forecast-text-body" hidden class="mt-2 text-base leading-relaxed text-stone-700 dark:text-stone-300"></p>
    </section>

    <!-- Live weather in Naarden. Data pushed hourly by Home Assistant to a GitHub
         gist and fetched client-side; see the <script> near </body>. Meteocons
         icons (MIT) self-hosted in /vendor/meteocons. Two cards (current + forecast)
         sit side by side on wide screens, stacked on narrow. Hidden until data loads. -->
    <div id="weather" hidden aria-label="Current weather and forecast for Naarden"
         class="mt-3 md:mt-6 w-full md:w-4/5 max-w-[1280px] rounded-2xl border border-black/5 bg-black/5 dark:border-white/10 dark:bg-white/10 px-4 py-4 md:px-8 md:py-6 shadow-xl">
        <!-- Secondary-data ticker: a marquee of the extra gist fields that don't fit the
             card proper (humidity, rain today, dew point, pressure, cloud cover, visibility,
             UV index). Populated by weather.js. A bonus layer — hidden entirely under
             prefers-reduced-motion (see weather.css), so motion-averse visitors get the
             clean core card. -->
        <div class="wx-ticker-wrap"><div class="wx-ticker-track" id="wx-ticker"></div></div>
        <!-- Six uniform blocks in one grid: 1 column on small screens, 2 on wider ones. -->
        <div class="wx-cols">
            <!-- Block 1: current condition -->
            <div class="wx-sub">
                <div class="wx-group">
                    <img id="wx-icon" class="wx-icon" src="../../vendor/meteocons/not-available.svg" alt="" width="56" height="56"/>
                    <div>
                        <div id="wx-condition" class="wx-val">—</div>
                        <div class="wx-lbl">Naarden</div>
                    </div>
                </div>
            </div>
            <!-- Block 2: temperature + wind -->
            <div class="wx-sub wx-tempwind">
                <div>
                    <div class="wx-val"><span id="wx-temp">—</span><span class="u">°C</span></div>
                    <div class="wx-lbl"><span id="wx-feels"></span></div>
                </div>
                <div class="wx-group">
                    <svg class="wx-compass" viewBox="0 0 100 100" aria-hidden="true">
                        <circle class="wx-ring" cx="50" cy="50" r="44"/>
                        <path id="wx-windmarker" class="wx-marker" d="M50 4 L44 17 L56 17 Z"/>
                        <text id="wx-winddir" class="wx-dir" x="50" y="59" text-anchor="middle">—</text>
                    </svg>
                    <div>
                        <div class="wx-val"><span id="wx-bft">—</span><span id="wx-bft-gust"></span> <span class="u">Bft</span></div>
                        <div class="wx-lbl"><span id="wx-beaufort">—</span></div>
                    </div>
                </div>
            </div>
            <!-- Separator between the current-conditions blocks and the forecast blocks -->
            <div class="wx-div" aria-hidden="true"></div>
            <!-- Block 3: hourly forecast -->
            <div id="wx-hourly-block" class="wx-sub wx-fc-group" hidden>
                <div class="wx-fc-head">Hourly forecast</div>
                <div id="wx-hourly" class="wx-fc"></div>
            </div>
            <!-- Block 4: daily forecast -->
            <div id="wx-daily-block" class="wx-sub wx-fc-group" hidden>
                <div class="wx-fc-head">Daily forecast</div>
                <div id="wx-forecast" class="wx-fc"></div>
            </div>
            <!-- Separator between the forecast blocks and the sun/moon blocks -->
            <div class="wx-div" aria-hidden="true"></div>
            <!-- Block 5: sun times -->
            <div id="wx-sun" class="wx-sub wx-sun" hidden>
                <span id="wx-astro-sunrise" class="wx-astro-item"><img class="wx-astro-icon" src="../../vendor/meteocons/sunrise.svg" alt="Sunrise" width="36" height="36"/><span id="wx-sunrise"></span></span>
                <span id="wx-astro-sunset" class="wx-astro-item"><img class="wx-astro-icon" src="../../vendor/meteocons/sunset.svg" alt="Sunset" width="36" height="36"/><span id="wx-sunset"></span></span>
            </div>
            <!-- Block 6: moon phase -->
            <div id="wx-moon-card" class="wx-sub wx-moon" hidden>
                <span id="wx-astro-moon" class="wx-astro-item"><img id="wx-moon-icon" class="wx-astro-icon" src="../../vendor/meteocons/moon-full.svg" alt="" width="36" height="36"/><span id="wx-moon"></span></span>
            </div>
        </div>
        <!-- Source attribution + freshness. weather.js only rewrites #wx-updated,
             so the static "Sourced from…" note beside it is safe. -->
        <div class="wx-foot wx-foot-right"><span>Sourced from my Home Assistant</span> · <span id="wx-updated">Updated —</span></div>
    </div>

</main>
